name: verify textures

# Two gates. `selftest` exercises the pipeline itself (with a stub generator, so
# it needs no credentials and no network). `textures` checks every committed
# texture. They exist because two real defects got past a human eyeball once
# already: a sprite that left two thirds of every cell empty (looked tiny in
# game), and preview GIFs that were not the shipped pixels.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow
      - run: bash tests/selftest.sh

  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow
      - name: Verify every committed texture
        run: python3 pipeline/verify_wa.py characters/*/out/*.png
