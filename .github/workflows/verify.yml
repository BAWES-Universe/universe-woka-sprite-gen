name: verify textures

# The gate: every committed texture must be a valid WorkAdventure woka texture.
# It exists because two real defects shipped past a human eyeball once already:
# a sprite that left two thirds of every cell empty (looked tiny in game), and
# GIF previews that were not the pixels of the shipped sheet.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet pillow
      - name: Verify every committed texture
        run: |
          python3 pipeline/verify_wa.py characters/*/out/*.png
